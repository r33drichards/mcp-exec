name: Docker Build and Push

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build Docker Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build Docker Image
        run: |
          nix build .#docker --print-build-logs
          ls -la result

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Load, tag and push arch image
        run: |
          docker load -i result
          docker tag wholelottahoopla/mcp-exec:latest "$IMAGE:${{ github.sha }}-${{ matrix.arch }}"
          docker push "$IMAGE:${{ github.sha }}-${{ matrix.arch }}"

  manifest:
    name: Create and Push Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Create and Push Manifest with Commit SHA
        run: |
          docker manifest create "$IMAGE:${{ github.sha }}" \
            "$IMAGE:${{ github.sha }}-amd64" \
            "$IMAGE:${{ github.sha }}-arm64"
          docker manifest annotate "$IMAGE:${{ github.sha }}" \
            "$IMAGE:${{ github.sha }}-amd64" --os linux --arch amd64
          docker manifest annotate "$IMAGE:${{ github.sha }}" \
            "$IMAGE:${{ github.sha }}-arm64" --os linux --arch arm64
          docker manifest push "$IMAGE:${{ github.sha }}"

      - name: Create and Push Latest Manifest
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          docker manifest create "$IMAGE:latest" \
            "$IMAGE:${{ github.sha }}-amd64" \
            "$IMAGE:${{ github.sha }}-arm64"
          docker manifest annotate "$IMAGE:latest" \
            "$IMAGE:${{ github.sha }}-amd64" --os linux --arch amd64
          docker manifest annotate "$IMAGE:latest" \
            "$IMAGE:${{ github.sha }}-arm64" --os linux --arch arm64
          docker manifest push "$IMAGE:latest"

  comment:
    name: Comment Docker Tags on PR
    runs-on: ubuntu-latest
    needs: manifest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- docker-image-tags -->'

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- docker-image-tags -->
            ## 🐳 Docker Image Ready

            **Multi-arch image (recommended):**
            ```bash
            docker pull ${{ env.IMAGE }}:${{ github.sha }}
            ```

            **Run with HTTP server:**
            ```bash
            docker run -d -p 8080:8080 -v /var/lib/mcp-exec:/logs \
              ${{ env.IMAGE }}:${{ github.sha }} \
              --http-port 8080 --bind-address 0.0.0.0 --directory-path /logs
            ```

            <details>
            <summary>Architecture-specific tags</summary>

            **AMD64:**
            ```bash
            docker pull ${{ env.IMAGE }}:${{ github.sha }}-amd64
            ```

            **ARM64:**
            ```bash
            docker pull ${{ env.IMAGE }}:${{ github.sha }}-arm64
            ```
            </details>

            ---
            *Built from commit ${{ github.sha }}*
